<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Manager — Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado">
        <div class="encabezado__superior">
            <a class="marca" href="index.html">Gym Manager</a>
            <button
                class="boton-menu"
                id="boton-menu"
                type="button"
                aria-label="Abrir menú"
                aria-expanded="false"
                aria-controls="navegacion"
            >
                <span class="boton-menu__linea"></span>
                <span class="boton-menu__linea"></span>
                <span class="boton-menu__linea"></span>
            </button>
        </div>

        <nav class="navegacion" id="navegacion" aria-label="Navegación principal">
            <ul class="navegacion__lista">
                <li class="navegacion__item">
                    <a class="navegacion__enlace navegacion__enlace--activo" href="index.html" aria-current="page">Dashboard</a>
                </li>
                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="clientes.html">Clientes</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="contenido">
        <h1 class="titulo-pagina">Dashboard</h1>

        <!-- Estado de carga: visible hasta que la API responde -->
        <p class="listado-clientes__vacio" id="dashboard-cargando">Cargando datos del Dashboard...</p>

        <!-- Estado de error: nunca se muestran valores simulados como respaldo -->
        <p class="aviso-pago aviso-pago--error" id="dashboard-error" hidden role="alert"></p>

        <!-- Tarjetas principales: se generan con JS a partir de la API -->
        <section class="tarjetas" id="tarjetas" aria-label="Resumen general del gimnasio" hidden></section>

        <div class="columnas" id="columnas-dashboard" hidden>
            <!-- Últimos pagos: datos reales de la API -->
            <section class="panel" aria-labelledby="titulo-ultimos-pagos">
                <h2 class="panel__titulo" id="titulo-ultimos-pagos">Últimos pagos</h2>
                <p class="listado-clientes__vacio" id="ultimos-pagos-vacio" hidden>Todavía no hay pagos registrados.</p>
                <ul class="lista" id="lista-ultimos-pagos"></ul>
            </section>

            <!-- Pendientes de pago: datos reales de la API -->
            <section class="panel" aria-labelledby="titulo-pendientes">
                <h2 class="panel__titulo" id="titulo-pendientes">Pendientes de pago</h2>
                <p class="listado-clientes__vacio" id="pendientes-vacio" hidden>No hay cuotas pendientes este mes.</p>
                <ul class="lista" id="lista-pendientes"></ul>
            </section>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navegacion.js"></script>
    <!-- Protección de la página y botón "Cerrar sesión" -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
