<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Manager — Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado">
        <div class="encabezado__superior">
            <a class="marca" href="index.html">Gym Manager</a>
            <button
                class="boton-menu"
                id="boton-menu"
                type="button"
                aria-label="Abrir menú"
                aria-expanded="false"
                aria-controls="navegacion"
            >
                <span class="boton-menu__linea"></span>
                <span class="boton-menu__linea"></span>
                <span class="boton-menu__linea"></span>
            </button>
        </div>

        <nav class="navegacion" id="navegacion" aria-label="Navegación principal">
            <ul class="navegacion__lista">
                <li class="navegacion__item">
                    <a class="navegacion__enlace navegacion__enlace--activo" href="index.html" aria-current="page">Dashboard</a>
                </li>
                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="clientes.html">Clientes</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="contenido">
        <h1 class="titulo-pagina">Dashboard</h1>

        <!-- Tarjetas principales (se generan con JS) -->
        <section class="tarjetas" id="tarjetas" aria-label="Resumen general del gimnasio"></section>

        <div class="columnas">
            <!-- Últimos pagos (datos simulados) -->
            <section class="panel" aria-labelledby="titulo-ultimos-pagos">
                <h2 class="panel__titulo" id="titulo-ultimos-pagos">Últimos pagos</h2>
                <ul class="lista" id="lista-ultimos-pagos"></ul>
            </section>

            <!-- Próximos vencimientos (datos simulados) -->
            <section class="panel" aria-labelledby="titulo-proximos-vencimientos">
                <h2 class="panel__titulo" id="titulo-proximos-vencimientos">Próximos vencimientos</h2>
                <ul class="lista" id="lista-proximos-vencimientos"></ul>
            </section>
        </div>
    </main>

    <script src="js/navegacion.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
